# =============================================================================
#  Sistema de Gestión Comercial - versión web
#  Los datos de conexión a PostgreSQL NO están aquí: se leen de conexion.properties
#  (generado por el instalador e ignorado por git). Ver ArchivoConexion.java.
# =============================================================================
spring.application.name=sistema-web
spring.main.banner-mode=off

# Puerto de la página web (http://IP-DEL-SERVIDOR:8080)
server.port=${PUERTO:8080}

# Sesiones: se cierran tras 30 minutos sin actividad.
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SGSESION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.compression.enabled=true

# Archivos estáticos con huella en el nombre: el navegador los guarda en caché
# y los descarga de nuevo solo cuando cambian.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**
spring.web.resources.cache.cachecontrol.max-age=7d

spring.thymeleaf.cache=true
# Fechas de los formularios en formato AAAA-MM-DD (el de los campos <input type="date">)
spring.mvc.format.date=iso

# Registro de eventos (carpeta logs junto al programa)
logging.file.name=logs/sistema-web.log
logging.logback.rollingpolicy.max-history=30
logging.level.root=INFO
