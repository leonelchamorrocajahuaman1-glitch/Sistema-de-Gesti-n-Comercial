<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head(${a.id == null} ? 'Nuevo almacén' : 'Editar almacén')}"></head>
<body>
<nav th:replace="~{fragmentos/base :: menu}"></nav>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1 class="h3 titulo" th:text="${a.id == null} ? 'Nuevo almacén' : 'Editar almacén'">Almacén</h1>
            <div th:replace="~{fragmentos/base :: mensajes}"></div>
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <form th:action="@{/almacenes/guardar}" method="post" data-un-envio>
                        <input type="hidden" name="id" th:value="${a.id}">
                        <div class="mb-3">
                            <label for="codigo" class="form-label">Código</label>
                            <input class="form-control" id="codigo" name="codigo" maxlength="10" required th:value="${a.codigo}">
                        </div>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input class="form-control" id="nombre" name="nombre" maxlength="100" required th:value="${a.nombre}">
                        </div>
                        <div class="mb-3">
                            <label for="direccion" class="form-label">Dirección</label>
                            <input class="form-control" id="direccion" name="direccion" maxlength="200" th:value="${a.direccion}">
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="activo" name="activo" value="true" th:checked="${a.activo}">
                            <label class="form-check-label" for="activo">Activo</label>
                        </div>
                        <div class="d-flex gap-2 justify-content-end">
                            <a class="btn btn-outline-secondary" th:href="@{/almacenes}">Cancelar</a>
                            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
