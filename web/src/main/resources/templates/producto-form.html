<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head(${p.id == null} ? 'Nuevo producto' : 'Editar producto')}"></head>
<body>
<nav th:replace="~{fragmentos/base :: menu}"></nav>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <h1 class="h3 titulo" th:text="${p.id == null} ? 'Nuevo producto' : 'Editar producto'">Producto</h1>
            <div th:replace="~{fragmentos/base :: mensajes}"></div>
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <form th:action="@{/productos/guardar}" method="post" data-un-envio>
                        <input type="hidden" name="id" th:value="${p.id}">
                        <div class="row g-3">
                            <div class="col-sm-4">
                                <label for="codigo" class="form-label">Código</label>
                                <input class="form-control" id="codigo" name="codigo" maxlength="20" required
                                       th:value="${p.codigo}" th:readonly="${p.id != null}">
                            </div>
                            <div class="col-sm-8">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input class="form-control" id="nombre" name="nombre" maxlength="150" required
                                       th:value="${p.nombre}">
                            </div>
                            <div class="col-sm-6">
                                <label for="categoria" class="form-label">Categoría</label>
                                <input class="form-control" id="categoria" name="categoria" maxlength="80"
                                       list="listaCategorias" th:value="${p.categoria}"
                                       aria-describedby="ayudaCategoria">
                                <datalist id="listaCategorias">
                                    <option th:each="c : ${categorias}" th:value="${c}"></option>
                                </datalist>
                                <div id="ayudaCategoria" class="form-text">Elija una o escriba una nueva.</div>
                            </div>
                            <div class="col-6 col-sm-3">
                                <label for="unidad" class="form-label">Unidad</label>
                                <input class="form-control" id="unidad" name="unidad" maxlength="10" required
                                       list="listaUnidades" th:value="${p.unidad}">
                                <datalist id="listaUnidades">
                                    <option th:each="un : ${unidades}" th:value="${un}"></option>
                                </datalist>
                            </div>
                            <div class="col-6 col-sm-3">
                                <label for="metodo" class="form-label">Valuación</label>
                                <select class="form-select" id="metodo" name="metodo">
                                    <option value="PROMEDIO" th:selected="${p.metodo == 'PROMEDIO'}">Promedio</option>
                                    <option value="PEPS" th:selected="${p.metodo == 'PEPS'}">PEPS</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="controlaLote" name="controlaLote"
                                           value="true" th:checked="${p.controlaLote}">
                                    <label class="form-check-label" for="controlaLote">Controla lotes</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="controlaVencimiento"
                                           name="controlaVencimiento" value="true" th:checked="${p.controlaVencimiento}">
                                    <label class="form-check-label" for="controlaVencimiento">
                                        Controla vencimiento (requiere lotes)</label>
                                </div>
                            </div>
                            <div class="col-6 col-sm-3">
                                <label for="diasAlerta" class="form-label">Días de alerta</label>
                                <input class="form-control" type="number" min="0" max="3650" step="1" id="diasAlerta"
                                       name="diasAlerta" th:value="${p.diasAlerta}" aria-describedby="ayudaDias">
                                <div id="ayudaDias" class="form-text">Antes del vencimiento.</div>
                            </div>
                            <div class="col-6 col-sm-3">
                                <label for="precioVenta" class="form-label">Precio de venta (S/)</label>
                                <input class="form-control" type="number" min="0" step="any" id="precioVenta"
                                       name="precioVenta" th:value="${p.precioVenta}">
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="activo" name="activo" value="true"
                                           th:checked="${p.activo}">
                                    <label class="form-check-label" for="activo">Activo</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex gap-2 justify-content-end mt-3">
                            <a class="btn btn-outline-secondary" th:href="@{/productos}">Cancelar</a>
                            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragmentos/base :: scripts}"></th:block>
</body>
</html>
