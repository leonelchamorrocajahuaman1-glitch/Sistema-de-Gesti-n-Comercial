# Levanta PostgreSQL 16 con el sistema instalado y datos de demostración.
#   docker compose up -d
#   docker compose exec db psql -U inventario -d inventario
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: inventario
      POSTGRES_DB: inventario
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/sql:ro
      - ./docker/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
