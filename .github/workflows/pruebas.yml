name: Pruebas y compilación

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas de base de datos (funcionales y de concurrencia)
        run: tests/run_tests.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Base para las pruebas de la aplicación
        run: |
          createdb inventario_ci
          ./install.sh inventario_ci --demo --clave-app clave_ci

      - name: Compilar la aplicación y ejecutar pruebas de integración (JDBC como cliente)
        working-directory: aplicacion
        env:
          INV_DB: inventario_ci
          INV_CLAVE: clave_ci
        run: mvn -B verify -Dtest='*' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Publicar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: sistema-gestion
          path: |
            aplicacion/target/sistema-gestion.jar
            instalacion/windows/EJECUTAR_SISTEMA.bat
